# Docker Publish — multi-arch GHCR image.
#
# Speed strategy (was ~20 min single-job QEMU multi-arch):
# 1. Matrix on native runners (ubuntu-latest + ubuntu-24.04-arm) — no QEMU Rust compile
# 2. celld built on host with rust-cache, injected via docker/prebuilt/<arch>/celld
# 3. Per-platform GHA + registry buildcache; manifest merge in a lightweight follow-up job
# Expected wall time: ~6-10 min (parallel amd64+arm64), down from ~20 min sequential QEMU.

name: Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUST_VERSION: 1.97.1

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            cache_tag: buildcache-linux-amd64
            digest_artifact: digests-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            cache_tag: buildcache-linux-arm64
            digest_artifact: digests-linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image name (lowercase)
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Install Rust (${{ env.RUST_VERSION }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Rust cache (celld)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: celld

      - name: Build celld natively (inject into image, skip in-Docker compile)
        run: |
          set -euo pipefail
          cd celld
          cargo build --release --locked -p celld --target "${{ matrix.rust_target }}"
          arch="${{ matrix.platform }}"
          arch="${arch#linux/}"
          mkdir -p "../docker/prebuilt/${arch}"
          cp "target/${{ matrix.rust_target }}/release/celld" "../docker/prebuilt/${arch}/celld"

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name=${{ env.IMAGE }},push=true
          cache-from: |
            type=gha,scope=${{ matrix.platform }}
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache_tag }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.platform }}
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache_tag }},mode=max
          build-args: |
            CELLD_PROFILE=release

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.digest_artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set image name (lowercase)
        run: |
          echo "IMAGE=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Release image summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "### GHCR image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
