name: Go

on:
  push:
    paths:
      - "cellp/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "cellp/**"
      - ".github/workflows/go.yml"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cellp/go.mod
          cache-dependency-path: cellp/go.sum
      - name: Test
        working-directory: cellp
        run: go test ./...
