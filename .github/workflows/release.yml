name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: auto

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
            esbuild_pkg: linux-x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            rust_target: aarch64-unknown-linux-gnu
            esbuild_pkg: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
            esbuild_pkg: darwin-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin
            esbuild_pkg: darwin-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: cellp/go.mod
          cache-dependency-path: cellp/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build cellp + cellpd
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT="${{ matrix.ext }}"
          VER="${GITHUB_REF_NAME}"
          cd cellp
          go build -trimpath -ldflags="-s -w -X github.com/cellp/cellp/internal/version.Version=${VER}" \
            -o "../dist/cellp${EXT}" ./cmd/cellp
          go build -trimpath -ldflags="-s -w -X github.com/cellp/cellp/internal/version.Version=${VER}" \
            -o "../dist/cellpd${EXT}" ./cmd/cellpd

      - name: Build celld
        run: |
          EXT="${{ matrix.ext }}"
          cd celld
          cargo build --release --locked -p celld --target ${{ matrix.rust_target }}
          mkdir -p ../dist
          cp "target/${{ matrix.rust_target }}/release/celld${EXT}" "../dist/celld${EXT}"

      - name: Build offshoot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT="${{ matrix.ext }}"
          GOPATH="$(go env GOPATH)"
          HOSTOS="$(go env GOHOSTOS)"
          HOSTARCH="$(go env GOHOSTARCH)"
          go install github.com/sricola/offshoot/cmd/offshoot@latest
          mkdir -p dist
          if [ "$GOOS" = "$HOSTOS" ] && [ "$GOARCH" = "$HOSTARCH" ]; then
            cp "${GOPATH}/bin/offshoot${EXT}" "dist/offshoot${EXT}"
          else
            cp "${GOPATH}/bin/${GOOS}_${GOARCH}/offshoot${EXT}" "dist/offshoot${EXT}"
          fi

      - name: Fetch esbuild
        env:
          ESBUILD_VERSION: "0.28.2"
        run: |
          EXT="${{ matrix.ext }}"
          PKG="${{ matrix.esbuild_pkg }}"
          mkdir -p dist "$RUNNER_TEMP/esbuild-dl"
          curl -fsSL "https://registry.npmjs.org/@esbuild/${PKG}/-/${PKG}-${ESBUILD_VERSION}.tgz" \
            -o "$RUNNER_TEMP/esbuild-dl/esbuild.tgz"
          tar -xzf "$RUNNER_TEMP/esbuild-dl/esbuild.tgz" -C "$RUNNER_TEMP/esbuild-dl"
          if [ -f "$RUNNER_TEMP/esbuild-dl/package/bin/esbuild" ]; then
            cp "$RUNNER_TEMP/esbuild-dl/package/bin/esbuild" "dist/esbuild${EXT}"
          else
            cp "$RUNNER_TEMP/esbuild-dl/package/esbuild.exe" "dist/esbuild${EXT}"
          fi
          chmod +x "dist/esbuild${EXT}" || true

      - name: Pack
        run: |
          VER="${GITHUB_REF_NAME}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"
          mkdir -p dist
          chmod +x dist/cellp dist/cellpd dist/celld dist/offshoot dist/esbuild
          tar -C dist -czf "cellp_${VER}_${OS}_${ARCH}.tar.gz" cellp cellpd celld offshoot esbuild

      - uses: actions/upload-artifact@v4
        with:
          name: cellp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cellp_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz

  publish:
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/cellp_*
          generate_release_notes: true
          fail_on_unmatched_files: true
