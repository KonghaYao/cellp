# Dashboard SPA + same-origin API/gateway proxy (VITE_CELLP_* empty at build time).
map $arg___cellp_host $cellp_gateway_host {
    ""      $http_host;
    default $arg___cellp_host;
}

server {
    listen 5190;
    server_name _;

    root /usr/share/cellp-dashboard;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location /v1/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/__gateway(/.*)?$ {
        set $gw_path $1;
        if ($gw_path = "") {
            set $gw_path /;
        }
        proxy_pass http://127.0.0.1:8787$gw_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $cellp_gateway_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
